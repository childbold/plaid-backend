<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plaid backend admin</title>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6a65; --card:#fff; --line:#e3e2dc; --accent:#2f5bd3; --bad:#b3261e; --ok:#1f7a4d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ecebe6; --muted:#9a9890; --card:#20201e; --line:#33322f; --accent:#7ea2ff; --bad:#ff8a80; --ok:#6fd3a0; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 820px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 18px; }
  input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  button { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; border-top: none; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  code { font-size: 13px; word-break: break-all; }
  #msg { min-height: 1.5em; margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Plaid backend admin</h1>
  <div class="muted" id="env"></div>

  <section>
    <h2>Admin key</h2>
    <div class="row">
      <input id="key" type="password" placeholder="ADMIN_API_KEY" style="flex:1; min-width:240px">
      <button id="save">Unlock</button>
    </div>
    <div class="muted">Kept in this tab's session storage only.</div>
  </section>

  <section>
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">Linked banks <span class="muted" id="count"></span></h2>
      <div class="row">
        <button id="syncAll">Sync all</button>
        <button class="primary" id="linkBtn">Link a bank</button>
      </div>
    </div>
    <div class="muted" id="sandboxHint" hidden>Sandbox: pick any bank, then log in with <code>user_good</code> / <code>pass_good</code>.</div>
    <table><thead><tr><th>Institution</th><th>Status</th><th>Last sync</th><th></th></tr></thead><tbody id="items"></tbody></table>
  </section>

  <section>
    <h2>Frontend clients</h2>
    <div class="row">
      <input id="clientName" placeholder="e.g. budget-app" style="flex:1; min-width:200px">
      <button id="addClient">Create API key</button>
    </div>
    <div id="newKey"></div>
    <table><thead><tr><th>Name</th><th>Created</th><th>Status</th><th></th></tr></thead><tbody id="clients"></tbody></table>
  </section>

  <div id="msg"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let adminKey = sessionStorage.getItem('adminKey') || '';
$('key').value = adminKey;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say = (t, bad) => { $('msg').textContent = t; $('msg').className = bad ? 'bad' : 'muted'; };

async function api(path, opts = {}) {
  const res = await fetch('/api/admin' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + adminKey },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || body.message || res.statusText), { body });
  return body;
}

async function refresh() {
  if (!adminKey) return;
  try {
    const items = await api('/items');
    $('count').textContent = `(${items.length} Items)`;
    $('items').innerHTML = items.map(i => `<tr>
      <td>${esc(i.institution_name || i.institution_id)}<div class="muted"><code>${esc(i.item_id)}</code></div>
        <div class="muted">${Object.entries(i.product_status).map(([p, st]) =>
          `<span class="${st.state === 'ok' ? 'ok' : st.state === 'unsupported' ? '' : 'bad'}">${esc(p)}: ${esc(st.state.replace('_', ' '))}</span>`).join(' · ')}</div></td>
      <td class="${i.status === 'ok' ? 'ok' : 'bad'}">${esc(i.status)}</td>
      <td class="muted">${esc(i.last_synced_at || 'never')}</td>
      <td class="row">
        <button data-act="sync" data-id="${esc(i.item_id)}">Sync</button>
        ${i.status !== 'ok' ? `<button data-act="relink" data-id="${esc(i.item_id)}">Re-auth</button>`
          : Object.values(i.product_status).some(st => st.state === 'consent_required')
          ? `<button data-act="relink" data-id="${esc(i.item_id)}" title="Opens Link to approve the products this bank hasn't shared yet">Grant access</button>` : ''}
        <button data-act="remove" data-id="${esc(i.item_id)}">Remove</button>
      </td></tr>`).join('') || '<tr><td colspan="4" class="muted">No banks linked yet.</td></tr>';

    const clients = await api('/clients');
    $('clients').innerHTML = clients.map(c => `<tr>
      <td>${esc(c.name)}</td><td class="muted">${esc(c.created_at)}</td>
      <td class="${c.revoked_at ? 'bad' : 'ok'}">${c.revoked_at ? 'revoked' : 'active'}</td>
      <td>${c.revoked_at ? '' : `<button data-act="revoke" data-id="${c.id}">Revoke</button>`}</td></tr>`).join('')
      || '<tr><td colspan="4" class="muted">No clients yet.</td></tr>';
    say('');
  } catch (e) { say(e.message, true); }
}

async function openLink(itemId) {
  const { link_token } = await api('/link/token', { method: 'POST', body: itemId ? { item_id: itemId } : {} });
  Plaid.create({
    token: link_token,
    onSuccess: async (public_token, metadata) => {
      if (itemId) { say('Updated. Syncing…'); await api(`/items/${itemId}/sync`, { method: 'POST' }); say('Updated.'); return refresh(); }
      try {
        await api('/link/exchange', { method: 'POST', body: { public_token, institution: metadata.institution } });
        say(`Linked ${metadata.institution?.name}. Initial sync running…`);
        setTimeout(refresh, 3000);
      } catch (e) { say(e.message + (e.body?.hint ? ' — ' + e.body.hint : ''), true); }
      refresh();
    },
    onExit: err => err && say(err.display_message || err.error_message || 'Link closed', true),
  }).open();
}

$('save').onclick = () => { adminKey = $('key').value.trim(); sessionStorage.setItem('adminKey', adminKey); refresh(); };
$('linkBtn').onclick = () => openLink().catch(e => say(e.message, true));
$('syncAll').onclick = async () => { say('Syncing…'); try { await api('/sync', { method: 'POST' }); refresh(); } catch (e) { say(e.message, true); } };
$('addClient').onclick = async () => {
  try {
    const c = await api('/clients', { method: 'POST', body: { name: $('clientName').value } });
    $('newKey').innerHTML = `<p>Key for <b>${esc(c.name)}</b> (copy it now, it won't be shown again):<br><code>${esc(c.api_key)}</code></p>`;
    $('clientName').value = ''; refresh();
  } catch (e) { say(e.message, true); }
};
document.body.addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const { act, id } = b.dataset;
  try {
    if (act === 'sync') { say('Syncing…'); await api(`/items/${id}/sync`, { method: 'POST' }); }
    if (act === 'relink') return openLink(id);
    if (act === 'remove' && confirm('Remove this bank? This frees the Plaid slot and deletes its local data.')) await api(`/items/${id}`, { method: 'DELETE' });
    if (act === 'revoke' && confirm('Revoke this client key?')) await api(`/clients/${id}`, { method: 'DELETE' });
    refresh();
  } catch (err) { say(err.message, true); }
});
fetch('/healthz').then(r => r.json()).then(h => { $('env').textContent = 'Plaid environment: ' + h.env; $('sandboxHint').hidden = h.env !== 'sandbox'; });
refresh();
</script>
</body>
</html>
